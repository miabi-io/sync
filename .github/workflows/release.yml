name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # A prerelease tag (v1.1.0-rc.1) must not move `latest`, which is what Miabi's catalog pulls.
          case "${GITHUB_REF_NAME}" in
            *-*) echo "PRERELEASE=true"  >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Smoke test
        run: |
          docker build -t miabi/sync:test .
          ./test/smoke.sh miabi/sync:test

      # Published to Docker Hub (primary, the platform default miabi/sync) and mirrored to GHCR.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            miabi/sync:${{ env.VERSION }}
            ghcr.io/miabi-io/sync:${{ env.VERSION }}
            ${{ env.PRERELEASE == 'false' && 'miabi/sync:latest' || '' }}
            ${{ env.PRERELEASE == 'false' && 'ghcr.io/miabi-io/sync:latest' || '' }}
