name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t miabi/sync:test .
      - name: Copy a volume through an rsync daemon
        run: ./test/smoke.sh miabi/sync:test
